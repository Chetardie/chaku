# The local stack (D23, ADR-0006): run it with `pnpm stack`, not `docker compose up`, so the
# storage buckets get their CORS rules. Guide: docs/guides/local-development.md
#
# Images are pinned to a tag and its digest; Renovate keeps both current. Host ports listen on
# 127.0.0.1 only and can be moved in `.env` when something else already uses them.
name: chaku

services:
  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: chaku
      POSTGRES_PASSWORD: chaku
      POSTGRES_DB: chaku
    ports:
      - 127.0.0.1:${CHAKU_POSTGRES_PORT:-5432}:5432
    volumes:
      # Postgres 18 images keep data in a versioned folder under /var/lib/postgresql.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --username=chaku, --dbname=chaku]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  redis:
    image: redis:8.10.2-trixie@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    # Presence, rate limits and pub/sub are short-lived: nothing is written to disk.
    command: [redis-server, --save, '', --appendonly, 'no']
    ports:
      - 127.0.0.1:${CHAKU_REDIS_PORT:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s

  # Stands in for Cloudflare R2 (ADR-0011). Browsers reach it through Caddy at
  # https://s3.chaku.localhost; server code on the host can use the direct port.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - mini
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
      - -webdav=false
      - -admin.ui=false
    ports:
      - 127.0.0.1:${CHAKU_S3_PORT:-8333}:8333
    volumes:
      - seaweedfs:/data
      - ./stack/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - 127.0.0.1:${CHAKU_SMTP_PORT:-1025}:1025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    ports:
      - 127.0.0.1:80:80
      - 127.0.0.1:443:443
    extra_hosts:
      # Apps run on the host with `pnpm dev`; Linux needs this name added by hand.
      - host.docker.internal:host-gateway
      # For the healthcheck below.
      - mail.chaku.localhost:127.0.0.1
    volumes:
      - ./stack/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # Healthy once the local CA exists and Caddy proxies Mailpit over HTTPS. Busybox wget can't
      # be given a CA, so the certificate chain is checked by `pnpm stack:check` instead.
      test:
        - CMD-SHELL
        - >-
          test -f /data/caddy/pki/authorities/local/root.crt &&
          wget -q -O /dev/null --no-check-certificate https://mail.chaku.localhost/readyz
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

volumes:
  postgres:
  seaweedfs:
  # Holds Caddy's local CA. `pnpm stack:reset` keeps it so the one-time trust step stays done.
  caddy:
