packages:
  - apps/*
  - apps/games/*
  - packages/*
  - packages/modules/*
  - stack

# The catalog is the only place dependency versions are written (ADR-0011).
# Workspace package.json files refer to it as "catalog:".
catalogMode: strict

catalog:
  # Build and workspace
  turbo: ^2.11.6
  '@types/node': ^24.19.0

  # TypeScript 7 does the type check; tools that load `typescript` get 6 until 7.1 ships its API (ADR-0011)
  typescript: npm:@typescript/typescript6@^6.0.2
  '@typescript/native': npm:typescript@^7.0.2

  # Lint and format
  eslint: ^10.11.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.71.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-jsx-a11y-x: ^0.2.0
  '@next/eslint-plugin-next': ^16.3.8
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  prettier: ^3.9.9

  # Tests
  vitest: ^5.0.3
  yaml: ^2.9.1

  # Local stack and storage (CHK-14): AWS SDK v3 against SeaweedFS locally and R2 in production
  '@aws-sdk/client-s3': ^3.1144.0
  '@aws-sdk/s3-request-presigner': ^3.1144.0

  # Database (CHK-17). Drizzle is pinned to an exact 1.0 RC, the same for the ORM and the kit
  # (ADR-0011); `pg` is the driver Graphile Worker shares, so jobs join Drizzle transactions.
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: ^8.23.1
  '@types/pg': ^8.23.1

  # Jobs and the worker (CHK-18, ADR-0008). `@chaku/db/migrate` installs Graphile Worker's schema
  # with the module migrations; `apps/worker` runs the jobs and is bundled with tsdown.
  graphile-worker: ^0.18.0
  tsdown: ^0.23.0

  # Web app (CHK-19, ADR-0011). Checked against the web data flow doc's "Checked against" table.
  next: ^16.3.8
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  babel-plugin-react-compiler: ^1.0.0
  '@orpc/server': ^1.15.4
  '@orpc/client': ^1.15.4
  '@orpc/tanstack-query': ^1.15.4
  '@tanstack/react-query': ^5.104.1
  next-intl: ^4.14.9
  zod: ^4.6.5

  # Logs and vendor adapters (CHK-19, D23). Nodemailer is the SMTP client for Mailpit locally.
  # Exact: pino 10.4.0 is newer than a day
  pino: 10.3.1
  pino-pretty: ^13.1.3
  nodemailer: ^10.0.13

  # Browser tests (CHK-19, D19)
  '@playwright/test': ^1.63.0
  '@axe-core/playwright': ^4.13.0
  happy-dom: ^20.14.5

  # Boundaries and git hooks (CHK-13)
  dependency-cruiser: ^18.5.0
  # Exact: 2.1.15 was published without provenance (trustPolicy refuses it), 2.1.16 is newer than a day
  lefthook: 2.1.14

# Supply chain. pnpm 12 already waits a day before installing a new release
# and refuses unapproved install scripts; these make the rules explicit.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  # 2023 ReDoS security patch, published by hand without the provenance later 7.x releases have
  - semver@6.3.1
overrides:
  # graphile-config (through graphile-worker) asks for @types/node 22, whose undici-types 6.21.0
  # was published without provenance (trustPolicy refuses it). Types only: use ours.
  'graphile-config>@types/node': 'catalog:'
strictDepBuilds: true
allowBuilds:
  # postinstall installs the git hooks from lefthook.yml (skipped when CI=true)
  lefthook: true
  # drizzle-kit's esbuild: its postinstall only checks the platform binary, which comes as an optional dependency
  esbuild: false
  # next-intl's message extractor. Both ship prebuilt binaries as optional dependencies; their
  # scripts only build from source (@parcel/watcher) or fall back to WebAssembly (@swc/core).
  '@parcel/watcher': false
  '@swc/core': false
